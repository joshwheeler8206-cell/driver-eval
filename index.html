<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="U.S. AutoForce Quarterly Review - mobile form for ride-along assessments">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quarterly Review">
<title>Quarterly Review</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" class="brand-logo">
    <div>
      <h1>Quarterly Review</h1>
      <p>Quarterly ride-along assessment</p>
    </div>
  </div>
</header>

<main id="view" class="view">
  <!-- Evaluate / Records / Quarterly views rendered by app.js -->
</main>

<nav class="tabbar">
  <button class="tab active" data-view="evaluate" aria-label="Evaluate">
    <svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2"/></svg>
    <span>Evaluate</span>
  </button>
  <button class="tab" data-view="records" aria-label="Records">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2"/></svg>
    <span>Records</span>
  </button>
  <button class="tab" data-view="quarterly" aria-label="Quarterly">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l3-4 3 2 4-6 3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5l2 2 2-2 2 2 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Quarterly</span>
  </button>
  <button class="tab" data-view="trends" aria-label="Trends">
    <svg viewBox="0 0 24 24"><path d="M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 17l4.5-6 3.5 3 5-7 3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="11" r="2.2" fill="currentColor"/></svg>
    <span>Trends</span>
  </button>
</nav>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
